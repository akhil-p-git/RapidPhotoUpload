spring:
  application:
    name: rapidphoto-upload-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54321/rapidphotoupload}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Changed from 'update' to 'validate' - Flyway handles schema
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 1GB

server:
  port: ${SERVER_PORT:8080}
  http2:
    enabled: true  # Enable HTTP/2 for better performance
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,image/jpeg,image/png,image/gif
  tomcat:
    threads:
      max: 300  # Support high concurrency in development
      min-spare: 20

# n8n Integration
n8n:
  base-url: ${N8N_BASE_URL:http://localhost:5678}
  webhook:
    photo-uploaded: /webhook/photo-uploaded
    photo-processed: /webhook/photo-processed
    upload-failed: /webhook/upload-failed

# Storage Configuration
storage:
  type: ${STORAGE_TYPE:local}  # Environment variable with fallback to 'local'
  local:
    upload-dir: ${STORAGE_LOCAL_DIR:./uploads}
  s3:
    bucket-name: ${S3_BUCKET_NAME:rapidphotoupload-media}
    region: ${AWS_REGION:auto}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    endpoint: ${S3_ENDPOINT:}
    path-style-access: ${S3_PATH_STYLE_ACCESS:false}

# Concurrency Configuration
upload:
  thread-pool:
    core-size: ${UPLOAD_CORE_SIZE:50}
    max-size: ${UPLOAD_MAX_SIZE:300}  # Increased for 500 concurrent uploads
    queue-capacity: ${UPLOAD_QUEUE_CAPACITY:2000}  # Increased for 500 concurrent uploads
  chunk-size: ${UPLOAD_CHUNK_SIZE:5242880}
  max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:104857600}  # 100 MB
  presigned:
    # Minutes, not hours. A presigned URL is a bearer credential to write at a
    # specific key; it is used within seconds of being issued, so a long window
    # only widens the period in which a leaked one still works.
    ttl-minutes: ${UPLOAD_PRESIGNED_TTL_MINUTES:10}
  cleanup:
    enabled: ${UPLOAD_CLEANUP_ENABLED:true}
    # How long an incomplete chunked upload may sit before its chunks are reclaimed.
    ttl-minutes: ${UPLOAD_CLEANUP_TTL_MINUTES:120}
    interval-ms: ${UPLOAD_CLEANUP_INTERVAL_MS:900000}
    initial-delay-ms: ${UPLOAD_CLEANUP_INITIAL_DELAY_MS:60000}
    max-per-run: ${UPLOAD_CLEANUP_MAX_PER_RUN:200}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Rate Limiting Configuration
rate-limit:
  # Buckets are keyed per client IP, so everyone behind one NAT or proxy shares
  # a bucket. The presigned path costs three requests per file, which makes the
  # upload budget below worth roughly capacity/3 files per minute.
  default:
    capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:100}
    refill-interval: ${RATE_LIMIT_DEFAULT_REFILL_SECONDS:60}  # seconds
  upload:
    capacity: ${RATE_LIMIT_UPLOAD_CAPACITY:5000}
    refill-interval: ${RATE_LIMIT_UPLOAD_REFILL_SECONDS:60}  # seconds

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.rapidphoto: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
